<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Login · DUELVANTA</title><style>
:root{--bg:#080a0d;--panel:#11151c;--line:#292d34;--gold:#c7a45d;--gold2:#efd18c;--text:#f3eee4;--muted:#9ba2ad}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#21180c 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);border:1px solid rgba(199,164,93,.28);background:linear-gradient(180deg,#12151b,#0b0e12);border-radius:18px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:32px}.brand img{width:44px;height:44px}.word{font-family:Georgia,serif;letter-spacing:.17em;color:var(--gold2);font-size:21px}.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}.card h1{font:400 40px/1.05 Georgia,serif;margin:10px 0 12px}.intro{color:var(--muted);line-height:1.6;margin-bottom:25px}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:7px;cursor:pointer}.tabs button.active{background:rgba(199,164,93,.12);color:var(--gold2)}label{display:block;font-size:11px;letter-spacing:.08em;color:#8f96a0;margin:13px 0 6px}input{width:100%;border:1px solid var(--line);background:#080b0f;color:var(--text);border-radius:9px;padding:13px;font-size:16px}.primary{width:100%;margin-top:18px;border:1px solid rgba(199,164,93,.55);background:#1a160f;color:var(--gold2);padding:13px;border-radius:9px;font-weight:700;letter-spacing:.05em;cursor:pointer}.secondary{width:100%;margin-top:10px;border:0;background:transparent;color:#aeb4bd;padding:10px;cursor:pointer}.msg{min-height:20px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5}.hidden{display:none}.footer{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.18em;color:#7f735d;text-align:center}.back{display:block;text-align:center;color:#8d949e;text-decoration:none;margin-top:18px;font-size:13px}</style></head><body><main class="card"><div class="brand"><img src="v-logo.svg" alt="DUELVANTA V"><div class="word">DUELVANTA</div></div><div class="eyebrow">Return to the arena</div><h1>Zugang</h1><p class="intro">Melde dich mit deinem aktivierten DUELVANTA-Account an.</p><div class="tabs"><button id="passwordTab" class="active">Passwort</button><button id="magicTab">E-Mail-Link</button></div><section id="passwordPanel"><label>E-Mail</label><input id="email" type="email" autocomplete="email" placeholder="deine@email.de"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="Dein Passwort"><button id="passwordLogin" class="primary">DUELVANTA BETRETEN</button><button id="forgot" class="secondary">Passwort vergessen?</button></section><section id="magicPanel" class="hidden"><label>E-Mail</label><input id="magicEmail" type="email" autocomplete="email" placeholder="deine@email.de"><button id="magicLogin" class="primary">LOGIN-LINK SENDEN</button><p class="intro" style="font-size:13px;margin:14px 0 0">Kein Passwort nötig. Wir senden einen einmaligen sicheren Login-Link an deine E-Mail-Adresse.</p></section><div id="msg" class="msg"></div><div class="footer">COLLECT. TRADE. BATTLE.</div><a class="back" href="index.html">← Zurück zu DUELVANTA</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://enifiaqsnqtbzylnfrpi.supabase.co','sb_publishable_pk2szDe_g7fJLUdAMEUevw_odrDmnuM',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const next=(params.get('next')||'app.html').replace(/[^a-zA-Z0-9._-]/g,'');let loginStarted=false;async function existing(){try{const {data:{session}}=await db.auth.getSession();if(session&&!loginStarted)location.replace(next)}catch(e){console.warn('Session check failed',e)}}existing();function tab(m){$('passwordPanel').classList.toggle('hidden',m!=='password');$('magicPanel').classList.toggle('hidden',m!=='magic');$('passwordTab').classList.toggle('active',m==='password');$('magicTab').classList.toggle('active',m==='magic');$('msg').textContent=''}$('passwordTab').onclick=()=>tab('password');$('magicTab').onclick=()=>tab('magic');$('passwordLogin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='Bitte E-Mail und Passwort eingeben.';return}loginStarted=true;$('passwordLogin').disabled=true;$('msg').textContent='Anmeldung wird geprüft …';try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error){$('msg').textContent='Login nicht möglich. Prüfe E-Mail und Passwort oder nutze den E-Mail-Link.';return}if(!data?.session){$('msg').textContent='Anmeldung konnte nicht abgeschlossen werden. Bitte erneut versuchen.';return}location.replace(next)}catch(e){$('msg').textContent='Anmeldung konnte technisch nicht abgeschlossen werden. Bitte erneut versuchen.';console.error(e)}finally{$('passwordLogin').disabled=false;loginStarted=false}};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('passwordLogin').click()});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('passwordLogin').click()});$('magicLogin').onclick=async()=>{const email=$('magicEmail').value.trim();if(!email){$('msg').textContent='Bitte deine E-Mail-Adresse eingeben.';return}$('magicLogin').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:'https://duelvanta.de/app.html'}});$('magicLogin').disabled=false;$('msg').textContent=error?'Login-Link konnte nicht gesendet werden: '+error.message:'Login-Link gesendet. Prüfe dein E-Mail-Postfach.'};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){$('msg').textContent='Gib zuerst oben deine E-Mail-Adresse ein.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://duelvanta.de/reset-password.html'});$('msg').textContent=error?'Reset-Mail konnte nicht gesendet werden: '+error.message:'Wenn der Account existiert, erhältst du jetzt eine E-Mail zum Zurücksetzen des Passworts.'};
</script></body></html>
