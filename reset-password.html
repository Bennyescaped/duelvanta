<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Passwort · DUELVANTA</title><style>:root{--bg:#080a0d;--panel:#11151c;--line:#292d34;--gold:#c7a45d;--gold2:#efd18c;--text:#f3eee4;--muted:#9ba2ad}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#21180c 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);border:1px solid rgba(199,164,93,.28);background:#101319;border-radius:18px;padding:30px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px}.word{font:21px Georgia,serif;letter-spacing:.17em;color:var(--gold2)}h1{font:400 38px Georgia,serif;margin:30px 0 10px}p{color:var(--muted);line-height:1.6}input{width:100%;border:1px solid var(--line);background:#080b0f;color:var(--text);border-radius:9px;padding:13px;margin:7px 0;font-size:16px}button{width:100%;margin-top:14px;border:1px solid rgba(199,164,93,.55);background:#1a160f;color:var(--gold2);padding:13px;border-radius:9px;font-weight:700;cursor:pointer}.msg{font-size:13px;color:var(--muted);margin-top:14px}</style></head><body><main class="card"><div class="brand"><img src="v-logo.svg" alt=""><div class="word">DUELVANTA</div></div><h1>Neues Passwort</h1><p>Vergib ein neues Passwort mit mindestens 10 Zeichen.</p><input id="a" type="password" autocomplete="new-password" placeholder="Neues Passwort"><input id="b" type="password" autocomplete="new-password" placeholder="Passwort wiederholen"><button id="save">PASSWORT SPEICHERN</button><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://enifiaqsnqtbzylnfrpi.supabase.co','sb_publishable_pk2szDe_g7fJLUdAMEUevw_odrDmnuM',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);$('save').onclick=async()=>{const a=$('a').value,b=$('b').value;if(a.length<10){$('msg').textContent='Bitte mindestens 10 Zeichen verwenden.';return}if(a!==b){$('msg').textContent='Die Passwörter stimmen nicht überein.';return}$('save').disabled=true;const {data:{session}}=await db.auth.getSession();if(!session){$('msg').textContent='Der Reset-Link ist ungültig oder abgelaufen. Fordere über die Login-Seite einen neuen Link an.';$('save').disabled=false;return}const {error}=await db.auth.updateUser({password:a});$('save').disabled=false;if(error){$('msg').textContent='Passwort konnte nicht gespeichert werden: '+error.message;return}$('msg').textContent='Passwort gespeichert. Du wirst weitergeleitet …';setTimeout(()=>location.replace('app.html'),900)};</script></body></html>
