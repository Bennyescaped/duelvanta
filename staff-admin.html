<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DUELVANTA · Staff Control</title><style>:root{--bg:#080a0d;--p:#12161d;--l:#292e37;--g:#c7a45d;--g2:#efd18c;--t:#f3eee4;--m:#9ba2ad;--bad:#d88a8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding-bottom:16px}.brand{display:flex;gap:11px;align-items:center;color:var(--g2);font:20px Georgia,serif;letter-spacing:.14em}.brand img{width:38px}.top a{color:var(--g2);text-decoration:none}.hero{padding:40px 0 20px}.eyebrow{color:var(--g);font-size:10px;letter-spacing:.18em}.hero h1{font:400 44px Georgia,serif;margin:8px 0}.hero p{color:var(--m)}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.btn{border:1px solid var(--l);background:#0e1117;color:var(--t);border-radius:9px;padding:10px 12px;cursor:pointer}.btn.gold{border-color:#806b40;color:var(--g2)}.btn.bad{color:#efaaaa}.card{border:1px solid var(--l);background:linear-gradient(180deg,#141820,#0d1015);border-radius:15px;padding:17px;margin-bottom:12px}.appHead{display:flex;justify-content:space-between;gap:10px}.appHead h3{font:400 25px Georgia,serif;margin:3px 0}.meta,.body,.empty{color:var(--m);font-size:12px;line-height:1.6}.body{white-space:pre-wrap;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.log{display:grid;grid-template-columns:160px 1fr;gap:10px;border-bottom:1px solid var(--l);padding:10px 0}.pill{border:1px solid #6f5e3c;color:var(--g2);border-radius:999px;padding:5px 8px;font-size:10px}@media(max-width:650px){.appHead{display:block}.hero h1{font-size:34px}.log{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><div class="brand"><img src="v-logo.svg">DUELVANTA CONTROL</div><a href="admin.html">← Beta Control</a></header><section class="hero"><div class="eyebrow">OWNER · STAFF & PERMISSIONS</div><h1>Arena Staff.</h1><p>Bewerbungen prüfen, Rollen freigeben und jede sensible Änderung nachvollziehen.</p></section><div class="tabs"><button id="applicationsTab" class="btn gold">BEWERBUNGEN</button><button id="auditTab" class="btn">AUDIT LOG</button></div><section id="applications"></section><section id="audit" class="hidden"></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://enifiaqsnqtbzylnfrpi.supabase.co','sb_publishable_pk2szDe_g7fJLUdAMEUevw_odrDmnuM'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function auth(){const{data:{session}}=await db.auth.getSession();if(!session)return location.replace('login.html?next=staff-admin.html');const{data:p}=await db.from('profiles').select('role').eq('id',session.user.id).single();if(p?.role!=='owner'&&session.user.email!=='info@duelvanta.de')return location.replace('app.html');loadApps()}async function loadApps(){const{data,error}=await db.from('staff_applications').select('*').in('status',['pending','question']).order('created_at',{ascending:true});if(error){$('applications').innerHTML='<div class="card">Kein Owner-Zugriff.</div>';return}$('applications').innerHTML=data?.length?data.map(a=>`<article class="card"><div class="appHead"><div><span class="pill">${esc(a.requested_role.toUpperCase())}</span><h3>Bewerbung</h3><div class="meta">${new Date(a.created_at).toLocaleString('de-DE')} · TCG: ${esc((a.tcg||[]).join(', ')||'—')} · Sprachen: ${esc((a.languages||[]).join(', ')||'—')}</div></div><div class="pill">${esc(a.status.toUpperCase())}</div></div><div class="body"><b>Erfahrung</b>\n${esc(a.experience||'—')}\n\n<b>Regelkenntnisse</b>\n${esc(a.rules_knowledge||'—')}\n\n<b>Verfügbarkeit</b>\n${esc(a.availability||'—')}\n\n<b>Motivation</b>\n${esc(a.motivation)}</div><div class="actions"><button class="btn gold" onclick="review('${a.id}','approved')">FREISCHALTEN</button><button class="btn" onclick="review('${a.id}','question')">RÜCKFRAGE MARKIEREN</button><button class="btn bad" onclick="review('${a.id}','rejected')">ABLEHNEN</button></div></article>`).join(''):'<div class="card empty">Keine offenen Staff-Bewerbungen.</div>'}async function review(id,decision){const note=prompt(decision==='approved'?'Interne Notiz zur Freischaltung (optional)':decision==='rejected'?'Grund/Notiz (optional)':'Welche Rückfrage soll vermerkt werden?')||null;const{error}=await db.rpc('review_staff_application',{p_application_id:id,p_decision:decision,p_note:note});if(error)return alert(error.message);loadApps()}async function loadAudit(){const{data,error}=await db.from('admin_audit_log').select('*').order('created_at',{ascending:false}).limit(100);$('audit').innerHTML=error?'<div class="card">Audit Log nicht verfügbar.</div>':`<div class="card">${(data||[]).map(x=>`<div class="log"><span>${new Date(x.created_at).toLocaleString('de-DE')}</span><div><b>${esc(x.action)}</b><div class="meta">${esc(JSON.stringify(x.details))}</div></div></div>`).join('')||'<div class="empty">Noch keine Einträge.</div>'}</div>`}$('applicationsTab').onclick=()=>{$('applications').classList.remove('hidden');$('audit').classList.add('hidden');$('applicationsTab').classList.add('gold');$('auditTab').classList.remove('gold');loadApps()};$('auditTab').onclick=()=>{$('audit').classList.remove('hidden');$('applications').classList.add('hidden');$('auditTab').classList.add('gold');$('applicationsTab').classList.remove('gold');loadAudit()};auth();</script></body></html>
