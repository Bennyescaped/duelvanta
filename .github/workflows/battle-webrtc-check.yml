name: Battle WebRTC Check
on:
  pull_request:
    paths:
      - 'battle*.js'
      - 'battle*.html'
      - 'battle-spectator.css'
      - 'database/battle-spectator-*.sql'
      - 'supabase/functions/battle-spectator-media-reconciler/**'
      - 'site-nav.js'
      - 'tests/battle-*'
      - '.github/ci/**'
      - '.github/workflows/battle-webrtc-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectator_database:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real PostgreSQL spectator access, lifecycle and concurrent role boundaries
        run: |
          node tests/battle-spectator-database-test.mjs
          node tests/battle-spectator-media-database-test.mjs
      - name: Spectator database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-spectator-database-evidence
          path: test-results/battle-spectator-database.json
          if-no-files-found: ignore
  battle_webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated camera restart and async state regressions
        run: |
          node --check battle.js
          node --check battle-webrtc.js
          node --check battle-spectator.js
          node --check battle-spectator-host.js
          node --check tests/battle-spectator-browser-test.mjs
          node --check tests/battle-webrtc-browser-test.mjs
          node --check tests/battle-async-state-test.mjs
          node --check tests/battle-private-join-contract-test.mjs
          node --check tests/battle-dispute-resolution-test.mjs
          node --check tests/battle-judge-desk-test.mjs
          node tests/battle-async-state-test.mjs
          node tests/battle-private-join-contract-test.mjs
          node tests/battle-dispute-resolution-test.mjs
          node tests/battle-judge-desk-test.mjs
          node tests/battle-spectator-media-reconciler-contract-test.mjs
          node tests/battle-webrtc-restart-test.mjs
      - name: Install pinned browser test runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
          .github/ci/node_modules/.bin/playwright install chromium
      - name: Independent spectator browser lifecycle and read-only UI
        run: node tests/battle-spectator-browser-test.mjs
      - name: Real WebRTC browser regression with isolated signaling
        run: node tests/battle-webrtc-browser-test.mjs
      - name: Browser evidence (no media recordings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-webrtc-evidence
          path: |
            test-results/battle-webrtc-browser.json
            test-results/battle-async-state.json
            test-results/battle-spectator-browser.json
            test-results/battle-spectator-*.png
          if-no-files-found: ignore
