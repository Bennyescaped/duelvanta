name: TRADE Diagnostic
on:
  pull_request:
    paths:
      - 'trade*.js'
      - 'trade.html'
      - 'tests/trade-*'
      - 'tests/market-*'
      - 'tests/account-data-*'
      - 'tests/runtime-routing-contract-test.mjs'
      - 'tests/account-home-battle-live-test.mjs'
      - 'api/market-*.js'
      - 'api/compliance-message-dispatch.js'
      - 'api/account-data-erasure.js'
      - 'database/market-*.sql'
      - 'database/account-data-*.sql'
      - '.github/workflows/trade-ci-diagnostics.yml'
  workflow_dispatch:

jobs:
  trade_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
          .github/ci/node_modules/.bin/playwright install chromium
      - name: Static and lightweight TRADE contracts
        run: |
          set -euo pipefail
          run(){ echo "==> $*"; timeout 60s "$@"; }
          run node --check trade-marketplace-ux.js
          run node --check trade-search-archive.js
          run node --check trade-automation.js
          run node --check trade-checkout.js
          run node --check trade-orders.js
          run node --check trade-notice-action.js
          run node --check trade-seller-moderation.js
          run node tests/runtime-routing-contract-test.mjs
          run node tests/account-home-battle-live-test.mjs
          run node tests/trade-automation-contract-test.mjs
          run node tests/trade-resolution-contract-test.mjs
          run node tests/trade-shipping-contract-test.mjs
          run node tests/b07-c2c-pickup-contract-test.mjs
          run node tests/trade-shipping-null-fallback-contract-test.mjs
          run node tests/trade-marketplace-ux-contract-test.mjs
          run node tests/market-seller-onboarding-contract-test.mjs
          run node tests/trade-seller-compliance-contract-test.mjs
          run node tests/market-seller-enforcement-contract-test.mjs
          run node tests/market-notice-action-contract-test.mjs
          run node tests/market-checkout-compliance-contract-test.mjs
          run node tests/supabase-runtime-config-test.mjs
          run node tests/market-tax-transparency-contract-test.mjs
          run node tests/compliance-message-dispatch-test.mjs
          run node tests/account-data-rights-contract-test.mjs
          run node tests/account-data-erasure-worker-test.mjs
          run node tests/market-stripe-connect-contract-test.mjs
          run node tests/market-stripe-connect-api-test.mjs
          run node tests/market-stripe-live-mode-api-test.mjs
      - name: TRADE database contracts
        run: |
          set -euo pipefail
          PGL="$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          run(){ echo "==> $*"; timeout 75s "$@"; }
          run node tests/trade-actions-database-test.mjs "$PGL"
          run node tests/market-seller-compliance-database-test.mjs
          run node tests/market-notice-action-database-test.mjs
          run node tests/market-checkout-compliance-database-test.mjs
          run node tests/market-tax-transparency-database-test.mjs
          run node tests/account-data-rights-database-test.mjs
          run node tests/account-data-erasure-username-guard-test.mjs "$PGL"
          run node tests/market-stripe-connect-database-test.mjs "$PGL"
          run node tests/market-stripe-live-mode-database-test.mjs "$PGL"
      - name: TRADE DOM model
        run: timeout 90s node tests/trade-dom-test.mjs "$PWD/node_modules/linkedom/esm/index.js"
      - name: TRADE browser E2E
        run: timeout 150s node tests/trade-browser-e2e.mjs
      - name: Notice browser E2E
        run: timeout 90s node tests/market-notice-action-browser-test.mjs
