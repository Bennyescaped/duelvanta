  tcg_i3_magic_persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
      TCG_M4_EVIDENCE_DIR: ${{ github.workspace }}/test-results/tcg-i3-m4
      npm_config_update_notifier: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
