      - name: Install existing pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
          # Historical native suites use sibling disposable source copies.
          ln -s "$GITHUB_WORKSPACE/.github/ci/node_modules" "$(dirname "$GITHUB_WORKSPACE")/node_modules"
      - name: Prove PostgreSQL 17 and postgres owner
        run: |
          mkdir -p "$TCG_M4_EVIDENCE_DIR"
          set -o pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL' | tee "$TCG_M4_EVIDENCE_DIR/pg17-version.log"
          DO $$ BEGIN
            ASSERT current_user = 'postgres';
            ASSERT current_setting('server_version_num')::integer / 10000 = 17;
          END $$;
          SELECT current_user, current_setting('server_version_num') AS server_version_num, version();
          SQL
