      - 'tests/market-seller-compliance-database-test.mjs'
      - 'tests/market-seller-onboarding-contract-test.mjs'
      - 'seller-onboarding.html'
      - 'seller-onboarding.css'
      - 'seller-onboarding.js'
      - 'listing-report.html'
      - 'listing-report.css'
      - 'listing-report.js'
      - 'admin-notice-action.css'
      - 'admin-notice-action.js'
      - 'tests/auth-boundary-database-test.mjs'
      - 'supabase/migrations/**'
      - 'tests/scanner-v16-contract-test.mjs'
      - 'tests/scanner-v16-acceptance-regression-test.mjs'
      - 'tests/scanner-v16-tcg-test.mjs'
      - 'tests/scanner-v16-quality-test.mjs'
      - 'tests/scanner-v16-explain-test.mjs'
      - 'tests/scanner-v16-resilience-test.mjs'
      - 'tests/scanner-v16-benchmark-session-test.mjs'
      - 'tests/scanner-v16-camera-test.mjs'
      - 'tests/scanner-v16-native-camera-test.mjs'
      - 'tests/scanner-v16-mobile-runtime-test.mjs'
      - 'tests/scanner-v16-mobile-route-test.mjs'
      - 'tests/scanner-v16-browser-e2e.mjs'
      - 'tests/scanner-v16-real-card-matrix.mjs'
      - 'tests/fixtures/**'
      - '.github/ci/**'
      - '.github/workflows/scanner-v16-check.yml'
  workflow_dispatch:
jobs:
  account_data_export_t2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
      - name: T2 own-data export and audit-only write proof on PostgreSQL 17
        run: |
          mkdir -p test-results
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --check
          node tests/generate-security-readiness.mjs --data-export --trade-lock --check
          node tests/account-data-export-collect-battle-test.mjs --native | tee test-results/account-data-export-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock | tee test-results/account-data-export-native-lock.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export | tee test-results/account-data-export-upgrade-native.log
      - name: G1 marker integrity and T2 regression on native PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --check
          node tests/account-processing-markers-test.mjs --native | tee test-results/account-processing-markers-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export --processing-markers | tee test-results/account-processing-markers-upgrade-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock --processing-markers | tee test-results/account-processing-markers-export-native.log
      - name: G2 closure privacy with G1 and T2 regression on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --check
          node tests/account-closure-privacy-test.mjs --native | tee test-results/account-closure-privacy-native.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy | tee test-results/account-closure-privacy-g1-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export --processing-markers --closure-privacy | tee test-results/account-closure-privacy-upgrade-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock --processing-markers --closure-privacy | tee test-results/account-closure-privacy-export-native.log
      - name: G3 scanner Hold with real SQL and stubbed provider on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --check
          node tests/scanner-processing-hold-test.mjs --native | tee test-results/scanner-processing-hold-native.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold | tee test-results/scanner-processing-hold-g1-native.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold | tee test-results/scanner-processing-hold-g2-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export --processing-markers --closure-privacy --scanner-hold | tee test-results/scanner-processing-hold-upgrade-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock --processing-markers --closure-privacy --scanner-hold | tee test-results/scanner-processing-hold-export-native.log
      - name: G4 Battle player admission with G1 G2 G3 T2 on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --check
          node tests/battle-player-processing-hold-test.mjs --native | tee test-results/battle-player-processing-hold-native.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold | tee test-results/battle-player-processing-hold-g1-native.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold | tee test-results/battle-player-processing-hold-g2-native.log
          node tests/scanner-processing-hold-test.mjs --native --battle-player-hold | tee test-results/battle-player-processing-hold-g3-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export --processing-markers --closure-privacy --scanner-hold --battle-player-hold | tee test-results/battle-player-processing-hold-upgrade-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold | tee test-results/battle-player-processing-hold-export-native.log
      - name: G5 Battle signal INSERT with G1 G2 G3 G4 T2 on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --check
          node tests/battle-signal-processing-hold-test.mjs --native | tee test-results/battle-signal-processing-hold-native.log
          node tests/battle-player-processing-hold-test.mjs --native --battle-signal-hold | tee test-results/battle-signal-processing-hold-g4-native.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold | tee test-results/battle-signal-processing-hold-g1-native.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold --battle-signal-hold | tee test-results/battle-signal-processing-hold-g2-native.log
          node tests/scanner-processing-hold-test.mjs --native --battle-player-hold --battle-signal-hold | tee test-results/battle-signal-processing-hold-g3-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock --data-export --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold | tee test-results/battle-signal-processing-hold-upgrade-native.log
          node tests/account-data-export-collect-battle-test.mjs --native --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold | tee test-results/battle-signal-processing-hold-export-native.log
      - name: D1 own withdrawal and complete G1-G5 T2 regression on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --check | tee test-results/battle-spectator-withdrawal-generate-security-readiness.log
          node tests/battle-spectator-withdrawal-test.mjs --native | tee test-results/battle-spectator-withdrawal-battle-spectator-withdrawal-test.log
          node tests/battle-signal-processing-hold-test.mjs --native --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-battle-signal-processing-hold-test.log
          node tests/battle-player-processing-hold-test.mjs --native --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-battle-player-processing-hold-test.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-account-processing-markers-test.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-account-closure-privacy-test.log
          node tests/scanner-processing-hold-test.mjs --native --battle-player-hold --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-scanner-processing-hold-test.log
          node tests/account-data-export-collect-battle-test.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-account-data-export-collect-battle-test.log
          node tests/production-upgrade-rehearsal.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal | tee test-results/battle-spectator-withdrawal-production-upgrade-rehearsal.log
      - name: D2 epoch closure and complete G1-G5 D1 T2 regression on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --check --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-generate-security-readiness.log
          node tests/battle-spectator-epoch-processing-hold-test.mjs --native | tee test-results/battle-spectator-epoch-processing-hold-native.log
          node tests/battle-spectator-withdrawal-test.mjs --native --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-battle-spectator-withdrawal-test.log
          node tests/battle-signal-processing-hold-test.mjs --native --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-battle-signal-processing-hold-test.log
          node tests/battle-player-processing-hold-test.mjs --native --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-battle-player-processing-hold-test.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-account-processing-markers-test.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-account-closure-privacy-test.log
          node tests/scanner-processing-hold-test.mjs --native --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-scanner-processing-hold-test.log
          node tests/account-data-export-collect-battle-test.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-account-data-export-collect-battle-test.log
          node tests/production-upgrade-rehearsal.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold | tee test-results/battle-spectator-epoch-processing-hold-production-upgrade-rehearsal.log
      - name: D3 closed subset and full G1-G5 D1 D2 T2 regression on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/staff-processing-hold-test.mjs --native | tee test-results/staff-processing-hold-native.log
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --check --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-generate-security-readiness.log
          node tests/battle-spectator-epoch-processing-hold-test.mjs --native --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-native.log
          node tests/battle-spectator-withdrawal-test.mjs --native --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-battle-spectator-withdrawal-test.log
          node tests/battle-signal-processing-hold-test.mjs --native --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-battle-signal-processing-hold-test.log
          node tests/battle-player-processing-hold-test.mjs --native --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-battle-player-processing-hold-test.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-account-processing-markers-test.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-account-closure-privacy-test.log
          node tests/scanner-processing-hold-test.mjs --native --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-scanner-processing-hold-test.log
          node tests/account-data-export-collect-battle-test.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-account-data-export-collect-battle-test.log
          node tests/production-upgrade-rehearsal.mjs --native --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold | tee test-results/staff-processing-hold-regression-production-upgrade-rehearsal.log
      - name: D4 publication and full G1-G5 D1 D2 closed-D3 T2 regression on PostgreSQL 17
        run: |
          set -o pipefail
          node tests/publication-processing-hold-test.mjs --native | tee test-results/publication-processing-hold-native.log
          node tests/staff-processing-hold-test.mjs --native --publication-hold | tee test-results/publication-processing-hold-staff-native.log
          node tests/generate-security-readiness.mjs --data-export --trade-lock --processing-markers --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --check --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-generate-security-readiness.log
          node tests/battle-spectator-epoch-processing-hold-test.mjs --native --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-native.log
          node tests/battle-spectator-withdrawal-test.mjs --native --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-battle-spectator-withdrawal-test.log
          node tests/battle-signal-processing-hold-test.mjs --native --spectator-withdrawal --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-battle-signal-processing-hold-test.log
          node tests/battle-player-processing-hold-test.mjs --native --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-battle-player-processing-hold-test.log
          node tests/account-processing-markers-test.mjs --native --closure-privacy --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-account-processing-markers-test.log
          node tests/account-closure-privacy-test.mjs --native --scanner-hold --battle-player-hold --battle-signal-hold --spectator-withdrawal --spectator-epoch-hold --staff-hold --publication-hold | tee test-results/publication-processing-hold-regression-account-closure-privacy-test.log
