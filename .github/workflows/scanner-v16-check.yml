          await appendFile(process.env.GITHUB_STEP_SUMMARY,['### P3-P1 one-record diagnosis',`Completion: ${l.diagnostic_completion_pass===true}; status: ${l.status}`,`Request creation attempts: ${l.request?.request_creation_attempts??'UNKNOWN'}; HTTP response observed: ${l.request?.response_observed===true}`,`Complete response: ${l.request?.response_complete===true}; bytes: ${l.request?.response_bytes??'UNKNOWN'}`,'A face-count contract reject is diagnostic evidence, not catalog admission.','Old fullscan disabled; I19 remains FAIL / LIVE_REACCEPTANCE_PENDING; no database publication.'].join('\n\n')+'\n');
          NODE
      - name: Compact single-record diagnostic evidence only
        if: always() && steps.record_gate.outputs.run == 'true'
