name: Scanner V16 Check
on:
  push:
    branches: [scanner-v16, main]
  pull_request:
    paths:
      - 'scanner-v16-*.js'
      - 'collect.html'
      - 'collect-ux.js'
      - 'tests/collect-ux-*.mjs'
      - 'tests/collect-mobile-ui-test.mjs'
      - 'tests/collect-binder-delete-*.mjs'
      - 'tests/helpers/f3-native-db.mjs'
      - 'supabase/migrations/*_collect_empty_binder_delete.sql'
      - 'site-nav.js'
      - 'supabase-environment.js'
      - 'app.html'
      - 'i18n.js'
      - 'tests/account-home-battle-live-test.mjs'
      - 'index.html'
      - 'welcome.html'
      - 'battle.html'
      - 'battle-*.js'
      - 'staff.html'
      - 'staff-admin.html'
      - 'ranking.html'
      - 'ranking.js'
      - 'u.html'
      - 'public-battle-profile.js'
      - 'tests/runtime-routing-contract-test.mjs'
      - 'tests/scanner-v16-collect-e2e.mjs'
      - 'scanner-v16-ai-pilot.html'
      - 'api/scanner-v16-gemini.js'
      - 'api/scanner-v16-ximilar.js'
      - 'api/scanner-v16-openai.js'
      - 'api/scanner-v16-recognize.js'
      - 'benchmark/scanner-pilot/recognize-server.cjs'
      - 'tests/scanner-v16-provider-test.mjs'
      - 'tests/scanner-v16-recognize-server-test.mjs'
      - 'benchmark/scanner-pilot/ximilar-*'
      - 'benchmark/scanner-pilot/score-ximilar.mjs'
      - 'tests/scanner-v16-ximilar-test.mjs'
      - 'benchmark/scanner-pilot/openai-*'
      - 'tests/scanner-v16-openai-test.mjs'
      - 'benchmark/scanner-pilot/gemini-*'
      - 'tests/scanner-v16-gemini-test.mjs'
      - 'vercel.json'
      - 'scanner-v16-assets/**'
      - 'tests/scanner-v16-references-test.mjs'
      - 'scanner-v16-lab.html'
      - 'scanner-v16.html'
      - 'scanner-v16-host.js'
      - 'database/collect-scanner-v16-*.sql'
      - 'database/collect-binder-*.sql'
      - 'database/b07-*.sql'
      - 'tests/b07-c2c-*.sql'
      - 'admin.html'
      - 'trade.html'
      - 'trade-*.js'
      - 'database/market-seller-*.sql'
      - 'database/market-notice-action-*.sql'
      - 'database/market-checkout-compliance-*.sql'
      - 'database/market-tax-transparency-*.sql'
      - 'database/account-data-rights-*.sql'
      - 'database/account-data-erasure-*.sql'
      - 'database/market-stripe-*.sql'
      - 'database/market-production-*.sql'
      - 'database/auth-*.sql'
      - 'api/compliance-message-dispatch.js'
      - 'api/account-data-erasure.js'
      - 'api/market-stripe-*.js'
      - 'profile.html'
      - 'profile.js'
      - 'profile.css'
      - 'profile-data-rights.js'
      - 'mfa.html'
      - 'mfa.js'
      - 'reset-password.html'
      - 'control-center.html'
      - 'control-center.js'
      - 'control-center-permissions.js'
      - 'control-center-auth-preflight.js'
      - 'tests/supabase-runtime-config-test.mjs'
      - 'MARKETPLACE_COMPLIANCE_REQUIREMENTS.md'
      - 'DUELVANTA_MASTERHANDOUT_V*.md'
      - 'tests/trade-*'
      - 'tests/account-data-*'
      - 'tests/market-stripe-*.mjs'
      - 'tests/market-seller-compliance-database-test.mjs'
      - 'tests/market-seller-onboarding-contract-test.mjs'
      - 'seller-onboarding.html'
      - 'seller-onboarding.css'
      - 'seller-onboarding.js'
      - 'listing-report.html'
      - 'listing-report.css'
      - 'listing-report.js'
      - 'admin-notice-action.css'
      - 'admin-notice-action.js'
      - 'tests/auth-boundary-database-test.mjs'
      - 'supabase/migrations/**'
      - 'tests/scanner-v16-contract-test.mjs'
      - 'tests/scanner-v16-acceptance-regression-test.mjs'
      - 'tests/scanner-v16-tcg-test.mjs'
      - 'tests/scanner-v16-quality-test.mjs'
      - 'tests/scanner-v16-explain-test.mjs'
      - 'tests/scanner-v16-resilience-test.mjs'
      - 'tests/scanner-v16-benchmark-session-test.mjs'
      - 'tests/scanner-v16-camera-test.mjs'
      - 'tests/scanner-v16-native-camera-test.mjs'
      - 'tests/scanner-v16-mobile-runtime-test.mjs'
      - 'tests/scanner-v16-mobile-route-test.mjs'
      - 'tests/scanner-v16-browser-e2e.mjs'
      - 'tests/scanner-v16-real-card-matrix.mjs'
      - 'tests/fixtures/**'
      - '.github/ci/**'
      - '.github/workflows/scanner-v16-check.yml'
  workflow_dispatch:
jobs:
  collect_f3_database:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
      F3_NATIVE_PG: '1'
      F3_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
      - name: Required real PostgreSQL role, cleanup and lock-order regressions
        run: |
          mkdir -p test-results
          set -o pipefail
          node tests/collect-binder-delete-database-test.mjs | tee test-results/collect-f3-roles.log
          node tests/account-data-rights-database-test.mjs | tee test-results/collect-f3-account-erasure.log
          node tests/account-data-erasure-username-guard-test.mjs | tee test-results/collect-f3-username-erasure.log
          node tests/collect-binder-delete-concurrency-test.mjs
      - name: F3 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-f3-postgres-evidence
          path: test-results/collect-f3-*
          if-no-files-found: error
  quota_database:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Real SQL quota and B07 C2C regressions in disposable database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/scanner-v16-quota-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/collect-scanner-v16-weekly-quota.sql
          psql -v ON_ERROR_STOP=1 -f tests/scanner-v16-quota-database.sql
          psql -v ON_ERROR_STOP=1 -f database/collect-scanner-v16-owner-control.sql
          psql -v ON_ERROR_STOP=1 -f tests/scanner-v16-owner-control-database.sql
          psql -v ON_ERROR_STOP=1 -f tests/b07-c2c-postgres-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/b07-l07-01-c2c-swap-v1-schema.sql
          psql -v ON_ERROR_STOP=1 -f database/b07-l07-01-c2c-swap-v1-binding.sql
          psql -v ON_ERROR_STOP=1 -f database/b07-l07-01-c2c-swap-v1-fulfillment.sql
          psql -v ON_ERROR_STOP=1 -f database/b07-l07-01-c2c-swap-v1-problems.sql
          psql -v ON_ERROR_STOP=1 -f tests/b07-c2c-postgres-regression.sql
          psql -v ON_ERROR_STOP=1 -f tests/trade-sale-only-database.sql
          psql -v ON_ERROR_STOP=1 -f tests/market-production-trade-lock-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/market-production-trade-lock-v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/market-production-trade-lock-database.sql
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check scanner-v16-tcg.js
          node --check scanner-v16-core.js
          node --check scanner-v16-quality.js
          node --check scanner-v16-resilience.js
          node --check scanner-v16-explain.js
          node --check scanner-v16-guidance.js
          node --check scanner-v16-ui.js
          node --check scanner-v16-camera.js
          node --check scanner-v16-native-camera.js
          node --check scanner-v16-binder.js
          node --check scanner-v16-market.js
          node --check scanner-v16-overlay.js
          node --check scanner-v16-geometry.js
          node --check scanner-v16-vision.js
          node --check scanner-v16-benchmark.js
          node --check scanner-v16-benchmark-session.js
          node --check scanner-v16-freeform-ui.js
          node --check scanner-v16-loader.js
          node --check scanner-v16-runtime.js
          node --check scanner-v16-host.js
          node --check scanner-v16-references.js
          node --check scanner-v16-catalog.js
          node --check scanner-v16-recovery.js
          node --check scanner-v16-live.js
          node --check scanner-v16-ocr.js
          node --check site-nav.js
          node --check supabase-environment.js
          node --check ranking.js
          node --check public-battle-profile.js
          node --check mfa.js
          node --check control-center.js
          node --check control-center-permissions.js
          node --check control-center-auth-preflight.js
      - name: Scanner V16 contract
        run: |
          node tests/scanner-v16-contract-test.mjs
          node tests/scanner-v16-binder-layout-test.mjs
          node tests/scanner-v16-entry-test.mjs
      - name: Gemini private pilot (no provider calls)
        run: |
          node --check api/scanner-v16-gemini.js
          node --check scanner-v16-ai-pilot.js
          node tests/scanner-v16-gemini-test.mjs
          node --check api/scanner-v16-ximilar.js
          node tests/scanner-v16-ximilar-test.mjs
          node --check api/scanner-v16-openai.js
          node tests/scanner-v16-openai-test.mjs
      - name: Ximilar integration and durable quota boundary (no paid calls)
        run: |
          node --check api/scanner-v16-recognize.js
          node --check scanner-v16-provider.js
          node tests/scanner-v16-slab-test.mjs
          node tests/scanner-v16-reference-server-test.mjs
          node tests/scanner-v16-provider-test.mjs
          node tests/scanner-v16-recognize-server-test.mjs
      - name: Verified artwork reference cache
        run: node tests/scanner-v16-references-test.mjs
      - name: Pokemon and One Piece recognition
        run: node tests/scanner-v16-tcg-test.mjs
      - name: Evidence quality gates
        run: node tests/scanner-v16-quality-test.mjs
      - name: Explainable confidence UI
        run: node tests/scanner-v16-explain-test.mjs
      - name: Resilience and capture guidance
        run: node tests/scanner-v16-resilience-test.mjs
      - name: Guided benchmark session
        run: node tests/scanner-v16-benchmark-session-test.mjs
      - name: Web camera readiness
        run: node tests/scanner-v16-camera-test.mjs
      - name: Native iOS photo capture
        run: node tests/scanner-v16-native-camera-test.mjs
      - name: Mobile photo pipeline and state recovery
        run: node tests/scanner-v16-mobile-runtime-test.mjs
      - name: Direct mobile route and benchmark integration
        run: node tests/scanner-v16-mobile-route-test.mjs
      - name: Install Chromium browser test runtime
        id: browser_runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          npm audit --audit-level=high --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
          .github/ci/node_modules/.bin/playwright install chromium
      - name: Battle and profile database access boundaries
        run: node tests/auth-boundary-database-test.mjs
      - name: Trade contracts and mobile order flow
        run: |
          node --check trade-marketplace-ux.js
          node --check trade-checkout.js
          node --check trade-orders.js
          node --check trade-notice-action.js
          node --check trade-seller-moderation.js
          node --check listing-report.js
          node --check admin-notice-action.js
          node --check api/compliance-message-dispatch.js
          node --check api/account-data-erasure.js
          node --check api/market-stripe-lib.js
          node --check api/market-stripe-onboarding.js
          node --check api/market-stripe-checkout.js
          node --check api/market-stripe-webhook.js
          node --check api/market-stripe-refund.js
          node --check profile-data-rights.js
          node tests/runtime-routing-contract-test.mjs
          node tests/account-home-battle-live-test.mjs
          node tests/trade-sale-only-test.mjs
          node tests/trade-release-gate-test.mjs
          node tests/trade-automation-contract-test.mjs
          node tests/trade-actions-database-test.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/trade-resolution-contract-test.mjs
          node tests/trade-shipping-contract-test.mjs
          node tests/b07-c2c-pickup-contract-test.mjs
          node tests/trade-shipping-null-fallback-contract-test.mjs
          node tests/trade-marketplace-ux-contract-test.mjs
          node tests/trade-legal-contract-model-test.mjs
          node tests/market-seller-compliance-database-test.mjs
          node tests/market-seller-onboarding-contract-test.mjs
          node tests/trade-seller-compliance-contract-test.mjs
          node tests/market-seller-enforcement-contract-test.mjs
          node tests/market-notice-action-contract-test.mjs
          node tests/market-notice-action-database-test.mjs
          node tests/market-checkout-compliance-contract-test.mjs
          node tests/market-checkout-compliance-database-test.mjs
          node tests/supabase-runtime-config-test.mjs
          node tests/market-tax-transparency-contract-test.mjs
          node tests/market-tax-transparency-database-test.mjs
          node tests/compliance-message-dispatch-test.mjs
          node tests/account-data-rights-contract-test.mjs
          node tests/account-data-rights-database-test.mjs
          node tests/account-data-erasure-worker-test.mjs
          node tests/account-data-erasure-username-guard-test.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/account-data-rights-ui-test.mjs "$PWD/node_modules/linkedom/esm/index.js"
          node tests/market-stripe-connect-contract-test.mjs
          node tests/market-stripe-connect-api-test.mjs
          node tests/market-stripe-connect-database-test.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/market-stripe-live-mode-api-test.mjs
          node tests/market-stripe-live-mode-database-test.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/trade-dom-test.mjs "$PWD/node_modules/linkedom/esm/index.js"
          node tests/trade-browser-e2e.mjs
          node tests/market-notice-action-browser-test.mjs
      - name: Second mobile acceptance regressions
        run: node tests/scanner-v16-acceptance-regression-test.mjs
      - name: COLLECT empty states and price completeness
        run: |
          node tests/collect-ux-test.mjs
          node tests/collect-ux-browser-test.mjs
          node tests/collect-mobile-ui-test.mjs
          node tests/collect-binder-delete-database-test.mjs
          node tests/collect-binder-delete-browser-test.mjs
      - name: Integrated COLLECT scanner and binder E2E
        run: node tests/scanner-v16-collect-e2e.mjs
      - name: Mobile browser upload E2E
        env:
          V16_LIVE_CATALOG: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node tests/scanner-v16-browser-e2e.mjs
      - name: Real complex-card reference recognition and recovery
        if: always() && steps.browser_runtime.outcome == 'success' && github.event_name == 'push'
        run: node tests/scanner-v16-real-card-matrix.mjs
      - name: Read-only live catalog availability
        if: github.event_name == 'push'
        run: node tests/scanner-v16-catalog-live-smoke.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-mobile-recognition
          path: test-results/
          if-no-files-found: ignore
