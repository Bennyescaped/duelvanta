          assert.deepEqual(r.counts,{PASS:20,FAIL:0});assert.deepEqual(r.cases.map(c=>c.id),Array.from({length:20},(_,i)=>'RECORD'+String(i+1).padStart(2,'0')));
          assert.deepEqual(w.counts,{PASS:20,FAIL:0});assert.deepEqual(w.subcase_counts,{PASS:45,FAIL:0});assert.deepEqual(w.cases.map(c=>c.id),Array.from({length:20},(_,i)=>'WRAP'+String(i+1).padStart(2,'0')));
          for(const x of [r,w]){assert.equal(x.provider_requests,0);assert.equal(x.database_publications,0);assert.equal(x.unexpected_external_io_attempts,0);}
          await writeFile('test-results/tcg-i3-m5-p3-p1-job/preflight-proof.json',JSON.stringify({at:new Date().toISOString(),RECORD:r.counts,WRAP:w.counts,WRAP_subcases:w.subcase_counts,provider_requests:0},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Exactly one hosted card GET and offline diagnosis
        if: steps.record_gate.outputs.run == 'true'
        env:
