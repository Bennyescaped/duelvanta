  production_upgrade_p001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
      P001_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
      - name: Reconstruct Production baseline and rehearse source-bound upgrade
        run: |
          mkdir -p test-results
          set -o pipefail
          node tests/production-upgrade-rehearsal.mjs --native --empty | tee test-results/production-upgrade-empty-native.log
          node tests/production-upgrade-rehearsal.mjs --native | tee test-results/production-upgrade-native.log
          node tests/production-upgrade-rehearsal.mjs --native --trade-lock | tee test-results/production-trade-lock-native.log
