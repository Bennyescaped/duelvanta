    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: One-time exact M5 candidate parent gate
        id: source_gate
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          if [ "$parent" = '80133a03eae70264f3e2d14a15d450fabb38041f' ] && [ "$GITHUB_RUN_ATTEMPT" = '1' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
