          node tests/tcg-i3-magic-single-record-diagnostic.mjs --real-diagnostic 2>&1 | tee test-results/tcg-i3-m5-p3-p1-job/diagnostic.log
      - name: Single-record outcome and historical boundaries
        if: always() && steps.record_gate.outputs.run == 'true'
