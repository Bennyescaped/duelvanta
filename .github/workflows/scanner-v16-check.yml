          await writeFile('test-results/tcg-i3-m5-p3-p1-job/start-binding.json',JSON.stringify({at:new Date().toISOString(),binding,node:process.version,provider_started:false},null,2)+'\n',{flag:'wx'});
          NODE
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "head=$current_pr_head" >> "$GITHUB_OUTPUT"
      - name: Synthetic single-record behavior and exact P3 WRAP20 preflight
        if: steps.record_gate.outputs.run == 'true'
        env:
          TCG_RECORD_EVIDENCE_DIR: test-results/tcg-i3-m5-p3-p1-tests
