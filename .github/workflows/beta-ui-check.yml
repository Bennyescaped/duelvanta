name: Beta UI Check
on:
  pull_request:
    paths:
      - 'duelvanta-beta.css'
      - 'beta-home.css'
      - 'beta-design-system.html'
      - 'index.html'
      - 'tests/beta-design-system-test.mjs'
      - 'tests/beta-home-test.mjs'
      - '.github/workflows/beta-ui-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Design system contract
        run: node tests/beta-design-system-test.mjs
      - name: Beta homepage contract
        run: node tests/beta-home-test.mjs
