name: PStTG isolated core reader and synthetic K5
on:
  pull_request:
    paths:
      - 'database/psttg-*'
      - 'tests/psttg-*'
      - 'tests/psttg_wire/**'
      - '.github/ci/w11-pg-ctl.sh'
      - '.github/workflows/psttg-core-check.yml'
permissions:
  contents: read
jobs:
  native_w11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing pinned test runtimes
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
          python -m pip install --disable-pip-version-check lxml==6.1.1 cryptography==46.0.0
      - name: V129 deterministic DIP validator lock regression
        run: python tests/psttg_wire/test_dip_lock.py
      - name: Disposable runner-owned PostgreSQL 17 cluster
        run: |
          # Explicit PGDG source; Ubuntu noble's default archive does not provide PG17.
          . /etc/os-release
          test "$VERSION_CODENAME" = noble
          test "$(dpkg --print-architecture)" = amd64
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/w11-pgdg.asc"
          sudo install -m 644 "$RUNNER_TEMP/w11-pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [arch=amd64 signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/w11-pgdg.list
          # Package installation must not create/start a system cluster.
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update
          pg_package_version=17.11-1.pgdg24.04+2
          sudo apt-get install -y --no-install-recommends "postgresql-17=$pg_package_version" "postgresql-client-17=$pg_package_version"
          test "$(id -u)" != 0
          pg_bin=/usr/lib/postgresql/17/bin
          for pg_tool in initdb postgres pg_ctl psql; do
            test -x "$pg_bin/$pg_tool"
            "$pg_bin/$pg_tool" --version
          done
          test "$(dpkg-query -W -f='${Version}' postgresql-17)" = "$pg_package_version"
          test "$(dpkg-query -W -f='${Version}' postgresql-client-17)" = "$pg_package_version"
          cluster="$RUNNER_TEMP/w11_isolated_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          socket_dir="$RUNNER_TEMP/w11_pg_socket_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$socket_dir" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          test "${#socket_dir}" -lt 90
          test ! -e "$socket_dir" && test ! -L "$socket_dir"
          mkdir -m 700 "$socket_dir"
          test "$(stat -c %u "$socket_dir")" = "$(id -u)"
          mkdir -p test-results "$RUNNER_TEMP/w11_ctl"
          "$pg_bin/initdb" -D "$cluster" -U postgres --auth=trust --no-locale
          cat >> "$cluster/postgresql.conf" <<'CONF'
          listen_addresses = '127.0.0.1'
          port = 55432
          fsync = on
          synchronous_commit = on
          log_statement = 'none'
          log_error_verbosity = 'terse'
          log_parameter_max_length_on_error = 0
          CONF
          printf "unix_socket_directories = '%s'\n" "$socket_dir" >> "$cluster/postgresql.conf"
          cp .github/ci/w11-pg-ctl.sh "$RUNNER_TEMP/w11_ctl/pg_ctl"
          chmod 700 "$RUNNER_TEMP/w11_ctl/pg_ctl"
          "$pg_bin/pg_ctl" -D "$cluster" -l "$GITHUB_WORKSPACE/test-results/w11-postgres.log" -w start
          echo "W11_PG_DATA=$cluster" >> "$GITHUB_ENV"
          echo "W11_PG_SOCKET_DIR=$socket_dir" >> "$GITHUB_ENV"
          echo "W11_PG_CTL=$RUNNER_TEMP/w11_ctl/pg_ctl" >> "$GITHUB_ENV"
          echo "W11_REAL_PG_CTL=$pg_bin/pg_ctl" >> "$GITHUB_ENV"
          echo "W11_PSQL=$pg_bin/psql" >> "$GITHUB_ENV"
          echo "W11_RESTART_EVIDENCE=$GITHUB_WORKSPACE/test-results" >> "$GITHUB_ENV"
          "$pg_bin/psql" -X -v ON_ERROR_STOP=1 -c "select version(),current_setting('data_directory'),current_setting('fsync'),current_setting('synchronous_commit');"
          test "$("$pg_bin/psql" -X -At -v ON_ERROR_STOP=1 -c 'show server_version_num')" = 170011
          "$pg_bin/psql" -X -At -v ON_ERROR_STOP=1 -c "select json_build_object('version',version(),'server_version_num',current_setting('server_version_num'),'data_directory',current_setting('data_directory'),'unix_socket_directories',current_setting('unix_socket_directories'),'port',current_setting('port'),'listen_addresses',current_setting('listen_addresses'),'fsync',current_setting('fsync'),'synchronous_commit',current_setting('synchronous_commit'),'system_identifier',(select system_identifier::text from pg_control_system()),'postmaster_started',pg_postmaster_start_time())" > test-results/w11-cluster.json
          python - "$cluster" "$socket_dir" <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path('test-results/w11-cluster.json');d=json.loads(p.read_text())
          assert int(d['server_version_num'])//10000==17
          assert d['data_directory']==sys.argv[1]
          assert d['unix_socket_directories']==sys.argv[2] and d['unix_socket_directories']!='/var/run/postgresql'
          assert d['port']=='55432' and d['listen_addresses']=='127.0.0.1'
          assert d['fsync']==d['synchronous_commit']=='on'
          pid=int((Path(sys.argv[1])/'postmaster.pid').read_text().splitlines()[0]);os.kill(pid,0)
          d.update(postmaster_pid=pid,runner_uid=os.getuid(),socket_owner_uid=Path(sys.argv[2]).stat().st_uid,start_gate='PASS')
          assert d['runner_uid']!=0 and d['runner_uid']==d['socket_owner_uid']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git rev-parse HEAD HEAD^{tree} > test-results/w11-ci-commit.txt
      - name: V124 unchanged N01-N22 native runner including real N19 restart
        run: |
          set -o pipefail
          python tests/psttg-w11-test.py --native 2>&1 | tee test-results/w11-native.log
          test -s test-results/w11-n19-restart.json
      - name: Stop only the disposable W11 cluster
        if: always()
        run: |
          if [ -n "${W11_PG_DATA:-}" ] && [ -f "$W11_PG_DATA/postmaster.pid" ]; then
            "$W11_REAL_PG_CTL" -D "$W11_PG_DATA" -m fast -w stop
          fi
      - name: Native W11 and cluster restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psttg-w11-native-evidence
          path: |
            test-results/psttg-w11-native.json
            test-results/w11-*.json
            test-results/w11-*.log
            test-results/w11-ci-commit.txt
          if-no-files-found: error
  native_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci
          ln -s .github/ci/node_modules node_modules
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned offline XML runtime
        run: python -m pip install --disable-pip-version-check lxml==6.1.1 cryptography==46.0.0
      - name: Send-free DPI DSM DIP NN schema and business rules
        run: python tests/psttg-wire-test.py
      - name: V120 synthetic offline M02 signature and bound envelope
        run: python -m unittest discover -s tests/psttg_wire -p test_m02.py -v
      - name: Native PostgreSQL 17 core and independent connection races
        run: node tests/psttg-capture-core-test.mjs --native
      - name: Native PostgreSQL 17 pure reader and two-order races
        run: node tests/psttg-removal-evaluation-test.mjs --native
      - name: Native PostgreSQL 17 synthetic K5 and independent restore peer
        run: node tests/psttg-k5-synthetic-test.mjs --native
      - name: Native PostgreSQL 17 isolated representation reader and controlled state fixtures
        run: node tests/psttg-representation-test.mjs --native
      - name: Native PostgreSQL 17 isolated V2 writer and unitmanifest connection
        run: node tests/psttg-v2-connection-test.mjs --native --wire
      - name: Native V111 representation regression with installed V2 connection
        run: node tests/psttg-representation-test.mjs --native --connection
      - name: Native unchanged existing data, functions, ACL and FK proof
        run: node tests/psttg-existing-invariants-test.mjs --native
      - name: Complete native L1 C B1 D3 D4 D1 D2 G1 G5 T2 upgrade readiness chain
        run: node tests/account-erasure-l1-regressions.mjs --native
      - name: Existing tax seller contract payment evidence regressions
        run: |
          node tests/market-tax-transparency-contract-test.mjs
          node tests/market-tax-transparency-database-test.mjs
          node tests/market-seller-compliance-database-test.mjs
          node tests/market-checkout-compliance-database-test.mjs
          node tests/account-data-rights-database-test.mjs
          node tests/account-data-erasure-worker-test.mjs
          node tests/market-stripe-connect-database-test.mjs
          node tests/market-stripe-live-mode-database-test.mjs
      - name: Synthetic results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psttg-isolated-core-evidence
          path: |
            test-results/psttg-*.json
            test-results/l1-erasure-regressions-native.json
          if-no-files-found: error
