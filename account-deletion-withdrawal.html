<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Löschanfrage zurücknehmen · DUELVANTA</title><style>
body{margin:0;background:#080a0d;color:#f3eee4;font:16px/1.55 system-ui,sans-serif;padding:24px}main{max-width:560px;margin:5vh auto;padding:26px;background:#11151c;border:1px solid #594b32;border-radius:16px}h1{font:32px Georgia,serif;color:#efd18c}label{display:block;margin-top:14px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;background:#080a0d;color:#f3eee4;border:1px solid #57504a;border-radius:8px;font:inherit}button{cursor:pointer;color:#efd18c}button:disabled{opacity:.55;cursor:wait}a{color:#efd18c}#message{min-height:3em}[hidden]{display:none!important}</style></head><body><main><a href="login.html">DUELVANTA · Zugang</a><h1>Löschanfrage zurücknehmen</h1><p>Eine Rücknahme ist nur möglich, solange die Datenbereinigung noch nicht begonnen hat und dies sicher nachweisbar ist. Andere Sperren bleiben bestehen. Deine Collection bleibt privat.</p>
<form id="signin"><label for="email">E-Mail deines Kontos</label><input id="email" type="email" autocomplete="email" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password"><button id="login" type="submit">Anmelden</button><button id="emailLink" type="button">Mit bestehendem E-Mail-Login anmelden</button></form>
<section id="requests" hidden><label for="request">Deine konkrete Löschanfrage</label><select id="request"></select><button id="begin" type="button">Rücknahme beginnen</button></section>
<section id="factor" hidden><label for="factorId">Authenticator</label><select id="factorId"></select><label for="code">Bestätigungscode</label><input id="code" inputmode="numeric" autocomplete="one-time-code"><button id="verify" type="button">Zweiten Faktor bestätigen</button></section><p id="message" role="status" aria-live="polite"></p><p><a href="profile.html">Zum Profil</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/api/compliance-message-dispatch?runtime_config=1"></script><script src="account-deletion-withdrawal.js"></script></body></html>
