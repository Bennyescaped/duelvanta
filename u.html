<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>DUELVANTA · Profil</title><style>:root{--bg:#080a0d;--panel:#11151c;--line:#252b34;--gold:#c7a45d;--gold2:#efd18c;--text:#f3eee4;--muted:#9ba2ad}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#17120b 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1080px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.top img{width:40px;height:40px}.word{font-family:Georgia,serif;letter-spacing:.15em;color:var(--gold2);font-size:20px}.back{margin-left:auto;color:var(--gold2);text-decoration:none;border:1px solid #3b3427;padding:9px 12px;border-radius:9px}.hero{padding:48px 0 24px}.identity{display:flex;gap:22px;align-items:center}.avatar{width:128px;height:128px;border-radius:50%;border:1px solid rgba(199,164,93,.5);object-fit:cover;background:#0b0e12}.fallback{display:grid;place-items:center;font:52px Georgia;color:var(--gold2)}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(38px,7vw,64px);margin:5px 0}.user{color:var(--gold2)}.muted{color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.badge{border:1px solid rgba(199,164,93,.35);background:rgba(199,164,93,.07);padding:7px 10px;border-radius:999px;font-size:11px;color:var(--gold2)}.card{border:1px solid var(--line);background:linear-gradient(180deg,#13171e,#0d1015);border-radius:16px;padding:22px;margin-top:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#0b0e13}.item strong{display:block;color:var(--gold2);margin-bottom:6px}.item span{display:block;color:var(--muted);font-size:12px;line-height:1.5}.empty{color:var(--muted);padding:18px 0}.hidden{display:none!important}@media(max-width:720px){.identity{align-items:flex-start}.avatar{width:92px;height:92px}.cards{grid-template-columns:1fr}.word{font-size:17px}}</style></head><body><div class="wrap"><header class="top"><img src="v-logo.svg" alt="DUELVANTA V"><div class="word">DUELVANTA</div><a class="back" href="app.html">DUELVANTA</a></header><main id="main" class="hidden"><section class="hero"><div class="identity"><div id="fallback" class="avatar fallback">V</div><img id="avatar" class="avatar hidden" alt="Profilbild"><div><div class="muted">DUELVANTA MEMBER</div><h1 id="name">—</h1><div id="username" class="user">@—</div><div id="badges" class="badges"></div></div></div></section><section class="card"><h2>Collection</h2><p id="privacy" class="muted"></p><div id="cards" class="cards"></div></section></main><section id="notFound" class="hero hidden"><h1>Profil nicht gefunden</h1><p class="muted">Dieser DUELVANTA Username existiert nicht oder das Profil ist nicht verfügbar.</p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=window.supabase.createClient('https://enifiaqsnqtbzylnfrpi.supabase.co','sb_publishable_pk2szDe_g7fJLUdAMEUevw_odrDmnuM',{auth:{persistSession:false,autoRefreshToken:false}});const $=id=>document.getElementById(id);let username=new URLSearchParams(location.search).get('username')||'';const path=location.pathname.split('/').filter(Boolean);if(!username&&path[0]==='u'&&path[1])username=decodeURIComponent(path[1]);username=username.trim().toLowerCase();function avatarUrl(p){return p?db.storage.from('profile-avatars').getPublicUrl(p).data.publicUrl:null}async function boot(){if(!username){$('notFound').classList.remove('hidden');return}const{data:p,error}=await db.rpc('get_public_duelvanta_profile',{p_username:username});const profile=Array.isArray(p)?p[0]:p;if(error||!profile){$('notFound').classList.remove('hidden');return}document.title=`${profile.display_name||'DUELVANTA'} (@${profile.username}) · DUELVANTA`;$('name').textContent=profile.display_name||profile.username;$('username').textContent='@'+profile.username;const url=avatarUrl(profile.avatar_path);if(url){$('avatar').src=url;$('avatar').classList.remove('hidden');$('fallback').classList.add('hidden')}const badges=[];if(profile.founder_number)badges.push(`FOUNDER #${String(profile.founder_number).padStart(3,'0')}`);if(profile.founder_generation==='GEN_I')badges.push('GENERATION I');if(profile.member_since)badges.push('MITGLIED SEIT '+new Intl.DateTimeFormat('de-DE',{month:'2-digit',year:'numeric'}).format(new Date(profile.member_since)));$('badges').innerHTML=badges.map(x=>`<span class="badge">${x}</span>`).join('');if(profile.collection_visibility==='private'){$('privacy').textContent='🔒 Diese Collection ist privat.';$('cards').innerHTML='';}else{const{data:c,error:ce}=await db.rpc('get_public_duelvanta_collection',{p_username:username});if(ce){$('privacy').textContent='Collection konnte nicht geladen werden.'}else{$('privacy').textContent=profile.collection_visibility==='custom'?'Es werden nur öffentlich freigegebene Ordner angezeigt.':'Öffentliche Collection';const rows=c||[];$('cards').innerHTML=rows.length?rows.map(x=>`<article class="item"><strong>${esc(x.card_name||'Unbekannte Karte')}</strong><span>${esc([x.tcg,x.set_name,x.card_number].filter(Boolean).join(' · '))}</span><span>${esc([x.language,x.variant,x.condition].filter(Boolean).join(' · '))}</span>${x.grading_company?`<span>${esc(x.grading_company)} ${esc(x.grade??'')}</span>`:''}<span>Menge: ${Number(x.quantity||1)}</span></article>`).join(''):'<div class="empty">Keine öffentlich sichtbaren Karten.</div>'}}$('main').classList.remove('hidden')}function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}boot()})();</script></body></html>
