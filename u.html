<img id="avatar" class="avatar hidden" alt="Profilbild"><div><div class="muted">DUELVANTA MEMBER</div><h1 id="name">—</h1><div id="username" class="user">@—</div><div id="badges" class="badges"></div></div></div></section><section class="card"><div class="sectionHead"><div><h2>Collection</h2><p id="privacy" class="muted"></p></div><div id="count" class="muted"></div></div><div id="cards" class="cards"></div></section></main><section id="notFound" class="hero hidden"><h1>Profil nicht gefunden</h1><p class="muted">Dieser DUELVANTA Username existiert nicht oder das Profil ist nicht verfügbar.</p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const SB='https://enifiaqsnqtbzylnfrpi.supabase.co',KEY='sb_publishable_pk2szDe_g7fJLUdAMEUevw_odrDmnuM';const db=window.supabase.createClient(SB,KEY,{auth:{persistSession:false,autoRefreshToken:false}});const $=id=>document.getElementById(id);let username=new URLSearchParams(location.search).get('username')||'';const path=location.pathname.split('/').filter(Boolean);if(!username&&path[0]==='u'&&path[1])username=decodeURIComponent(path[1]);username=username.trim().toLowerCase();function avatarUrl(p){return p?db.storage.from('profile-avatars').getPublicUrl(p).data.publicUrl:null}function tcgLabel(v){const x=String(v||'').toLowerCase();if(x==='one_piece')return'ONE PIECE';if(x==='pokemon')return'POKÉMON';return String(v||'TCG').replaceAll('_',' ').toUpperCase()}function clean(v){return String(v||'').trim()}async function getImage(itemId,img,fallback){try{const r=await fetch(SB+'/functions/v1/public-card-image',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({item_id:itemId})});if(!r.ok)return;const d=await r.json();if(d?.url){img.src=d.url;img.classList.remove('hidden');fallback.classList.add('hidden')}}catch{}}async function boot(){if(!username){$('notFound').classList.remove('hidden');return}const{data:p,error}=await db.rpc('get_public_duelvanta_profile',{p_username:username});const profile=Array.isArray(p)?p[0]:p;if(error||!profile){$('notFound').classList.remove('hidden');return}document.title=`${profile.display_name||'DUELVANTA'} (@${profile.username}) · DUELVANTA`;$('name').textContent=profile.display_name||profile.username;$('username').textContent='@'+profile.username;const url=avatarUrl(profile.avatar_path);if(url){$('avatar').src=url;$('avatar').classList.remove('hidden');$('fallback').classList.add('hidden')}const badges=[];if(profile.founder_number)badges.push(`FOUNDER #${String(profile.founder_number).padStart(3,'0')}`);if(profile.founder_generation==='GEN_I')badges.push('GENERATION I');if(profile.member_since)badges.push('MITGLIED SEIT '+new Intl.DateTimeFormat('de-DE',{month:'2-digit',year:'numeric'}).format(new Date(profile.member_since)));$('badges').innerHTML=badges.map(x=>`<span class="badge">${x}</span>`).join('');if(profile.collection_visibility==='private'){$('privacy').textContent='🔒 Diese Collection ist privat.';$('cards').innerHTML='';$('count').textContent='';}else{const{data:c,error:ce}=await db.rpc('get_public_duelvanta_collection',{p_username:username});if(ce){$('privacy').textContent='Collection konnte nicht geladen werden.'}else{const rows=c||[];$('privacy').textContent=profile.collection_visibility==='custom'?'Nur öffentlich freigegebene Ordner werden angezeigt.':'Öffentliche Collection';$('count').textContent=rows.length===1?'1 Karte':rows.length+' Karten';$('cards').innerHTML='';if(!rows.length){$('cards').innerHTML='<div class="empty">Keine öffentlich sichtbaren Karten.</div>'}else rows.forEach(x=>{const article=document.createElement('article');article.className='item';const iw=document.createElement('div');iw.className='imageWrap';const fb=document.createElement('div');fb.className='imageFallback';fb.textContent='V';const img=document.createElement('img');img.className='cardImage hidden';img.alt=clean(x.card_name)||'Karte';img.loading='lazy';iw.append(fb,img);const body=document.createElement('div');body.className='itemBody';const title=document.createElement('strong');title.textContent=clean(x.card_name)||'Unbekannte Karte';const meta=document.createElement('div');meta.className='meta';[tcgLabel(x.tcg),clean(x.set_name),clean(x.card_number),clean(x.language),clean(x.variant),clean(x.condition)].filter(Boolean).forEach(v=>{const s=document.createElement('span');s.className='pill';s.textContent=v;meta.appendChild(s)});const qty=document.createElement('div');qty.className='sub';qty.textContent='Menge: '+Number(x.quantity||1);body.append(title,meta);if(x.grading_company){const g=document.createElement('div');g.className='grading';g.textContent=clean(x.grading_company)+(x.grade!=null?' '+x.grade:'');body.appendChild(g)}body.appendChild(qty);article.append(iw,body);$('cards').appendChild(article);getImage(x.id,img,fb)})}}$('main').classList.remove('hidden')}boot()})();</script><script src="/public-battle-profile.js?v=1.0"></script></body></html>
